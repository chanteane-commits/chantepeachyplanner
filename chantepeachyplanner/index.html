<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#5d1e33"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Peachy Planner"><link rel="apple-touch-icon" href="icon-192.png"><title>The Type A's Ultimate Dream</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#efe7dc; --bg2:#e8dfd2; --card:#fbf7f0; --card2:#f4ede3; --field:#fffdf9;
  --ink:#2a1a1c; --ink2:#5b4a47; --muted:#8f7f77; --line:#e3d8c9; --line2:#d6c8b6;
  --accent:#6e1a2a; --accent2:#8a2638; --gold:#b38b4d; --btn:#2a1a1c; --btnInk:#fbf7f0;
  --side1:#86293a; --side2:#4a111d; --sideInk:#f6e9e2; --sideMuted:#d8b9b5;
  --shadow:0 1px 2px rgba(60,30,20,.05),0 8px 24px rgba(60,30,20,.06);
  --c-cal:#8c8378; --c-rel:#c06b5a; --c-money:#4b6fa8; --c-career:#b0913f; --c-home:#c7783e;
  --c-well:#5f8f6e; --c-travel:#7a6aa8; --c-self:#b0607e; --c-culture:#4f8c8c; --c-goals:#8a2638; --c-digital:#6b7b8c;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif; --sans:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
html[data-theme="dark"]{
  --bg:#171012; --bg2:#1d1416; --card:#221719; --card2:#2a1d20; --field:#1a1214;
  --ink:#f1e6de; --ink2:#cdbdb5; --muted:#9d8b84; --line:#36272a; --line2:#453336;
  --accent:#d9a3a9; --accent2:#e7b9be; --gold:#c9a46a; --btn:#f1e6de; --btnInk:#1a1113;
  --side1:#5e1a26; --side2:#22090f; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
/* Sidebar */
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:linear-gradient(180deg,var(--side1),var(--side2));color:var(--sideInk);padding:22px 14px 16px;display:flex;flex-direction:column;
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 1px,transparent 1px 4px),linear-gradient(180deg,var(--side1),var(--side2))}
.mono{width:40px;height:40px;border-radius:50%;background:#1d0a0f;border:1px solid rgba(255,255,255,.25);display:grid;place-items:center;font-family:var(--serif);font-size:16px;letter-spacing:.5px;color:#f6e9e2;cursor:pointer}
.owner{margin-top:14px;font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--sideMuted);font-weight:500}
.brand1{font-family:var(--serif);font-size:25px;line-height:1.05;margin-top:4px}
.brand2{font-family:var(--serif);font-style:italic;font-size:19px;line-height:1.1;opacity:.92}
.tagline{font-size:11px;color:var(--sideMuted);margin-top:4px}
.nav{margin-top:20px;display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;font-size:13px;color:var(--sideInk);opacity:.88}
.nav button:hover{background:rgba(255,255,255,.07);opacity:1}
.nav button.on{background:rgba(255,255,255,.13);opacity:1}
.nav svg,.side-foot svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;flex:none}
.side-foot{margin-top:auto;padding-top:16px}
.side-foot button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;font-size:12.5px;padding:7px 10px;border-radius:7px;color:var(--sideInk);opacity:.85}
.side-foot button:hover{background:rgba(255,255,255,.07)}
/* Main */
.main{min-width:0;padding:0 0 60px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:22px 32px 14px;position:relative}
.top::after{content:"";position:absolute;left:32px;right:32px;bottom:0;height:1px;background:linear-gradient(90deg,var(--gold),rgba(179,139,77,.5) 40%,transparent)}
.top h1{font-family:var(--serif);font-weight:500;font-size:30px;margin:0;line-height:1.1}
.top p{margin:3px 0 0;color:var(--muted);font-size:12.5px}
.top-actions{display:flex;gap:8px;align-items:center}
.icon-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.icon-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7}
.icon-btn.ring{box-shadow:0 0 0 3px var(--card),0 0 0 4px var(--line2)}
.burger{display:none}
.content{padding:18px 32px;max-width:1240px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tabs button{all:unset;cursor:pointer;padding:8px 10px;font-size:13px;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-color:var(--ink);font-weight:500}
/* Cards & grid */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow);margin-bottom:16px;min-width:0}
.card h2{font-family:var(--serif);font-weight:500;font-size:22px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card h3{font-family:var(--serif);font-weight:500;font-size:18px;margin:0 0 8px}
.card h2 small{font-family:var(--sans);font-size:12px;color:var(--muted);font-weight:400}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.grid>.card{margin-bottom:0}
.span2{grid-column:span 2}.span3{grid-column:span 3}
.note{font-size:12px;color:var(--muted);margin:6px 0 10px}
.kicker{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:500}
.stat{font-family:var(--serif);font-size:34px;line-height:1.1;margin:4px 0 2px}
.muted{color:var(--muted)}.small{font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
/* Forms */
.form{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end;margin-bottom:12px}
.fld{display:flex;flex-direction:column;gap:4px;flex:1 1 140px;min-width:0}
.fld.wide{flex:2 1 260px}.fld.full{flex:1 1 100%}.fld.narrow{flex:0 1 100px}
.fld>label{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=url],input[type=search],select,textarea{width:100%;background:var(--field);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;font-size:13px;outline:none;min-width:0}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(179,139,77,.15)}
.btn{font-family:var(--sans);background:var(--btn);color:var(--btnInk);border:0;border-radius:999px;padding:8px 16px;font-size:12.5px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{opacity:.9}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line2)}
.btn.sm{padding:5px 11px;font-size:11.5px}
.btn.danger{background:transparent;color:#b3434f;border:1px solid rgba(179,67,79,.4)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:2px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line2);background:transparent;border-radius:999px;padding:2px 9px;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);cursor:pointer}
.chip svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2}
.chip.live{background:var(--accent);color:#fff;border-color:var(--accent)}
.pill{display:inline-block;border:1px solid var(--line2);border-radius:999px;padding:4px 12px;font-size:12px;cursor:pointer;background:transparent}
.pill.on{background:var(--btn);color:var(--btnInk);border-color:var(--btn)}
.tag{display:inline-block;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;border-radius:4px;padding:1px 6px;background:var(--card2);color:var(--ink2);border:1px solid var(--line)}
.tag.high{color:#b3434f;border-color:rgba(179,67,79,.35)}.tag.med{color:var(--gold);border-color:rgba(179,139,77,.4)}
/* Lists */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:10px;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:500;font-size:13px;overflow-wrap:anywhere}
.item .s{font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
.item.done .t{text-decoration:line-through;color:var(--muted)}
.del{all:unset;cursor:pointer;color:var(--muted);padding:4px;border-radius:6px;display:grid;place-items:center}
.del:hover{color:#b3434f;background:rgba(179,67,79,.08)}
.del svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7}
.check{all:unset;cursor:pointer;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink2);display:grid;place-items:center;flex:none}
.check.on{background:var(--ink);border-color:var(--ink)}
.check.on::after{content:"";width:5px;height:9px;border:solid var(--card);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.empty{font-size:12.5px;color:var(--muted);padding:14px;border:1px dashed var(--line2);border-radius:10px;text-align:center}
.bar{height:6px;border-radius:999px;background:var(--line);overflow:hidden;margin:6px 0 4px}
.bar>i{display:block;height:100%;background:var(--gold);border-radius:999px}
.bar.over>i{background:#b3434f}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px;border-bottom:1px solid var(--line)}
.stars{display:inline-flex;gap:1px}
.stars button{all:unset;cursor:pointer;font-size:15px;color:var(--line2);line-height:1}
.stars button.on{color:var(--gold)}
/* Kanban */
.kanban{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.col{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:140px}
.col.over{outline:2px dashed var(--gold)}
.col-h{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:2px 4px 8px}
.kcard{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin-bottom:8px;cursor:grab;font-size:12.5px}
.kcard .t{font-weight:500;display:flex;justify-content:space-between;gap:6px}
.kcard .s{color:var(--muted);font-size:11px;margin-top:3px}
.addcard{all:unset;cursor:pointer;display:block;text-align:center;font-size:12px;color:var(--muted);padding:6px}
/* Charts */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--sans)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--ink2)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
/* Habit heat */
.heat{display:grid;grid-template-columns:repeat(14,18px);gap:5px}
.heat button{all:unset;cursor:pointer;width:18px;height:18px;border-radius:4px;background:var(--line)}
.heat button.on{background:var(--ink)}
html[data-theme="dark"] .heat button.on{background:#f1e6de}
.heat-h{display:grid;grid-template-columns:repeat(14,18px);gap:5px;font-size:9px;color:var(--muted);text-align:center}
/* Calendar */
.cal-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.cal-title{font-family:var(--serif);font-size:26px;margin-left:8px}
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:2px}
.seg button{all:unset;cursor:pointer;padding:4px 12px;border-radius:999px;font-size:12px}
.seg button.on{background:var(--btn);color:var(--btnInk)}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.month .dh{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.month .d{min-height:96px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px;font-size:11px;min-width:0;cursor:pointer}
.month .d.out{opacity:.45}.month .d.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.month .d .n{font-size:11px;color:var(--ink2);margin-bottom:3px}
.ev{display:block;border-radius:4px;padding:2px 5px;margin-bottom:2px;font-size:10.5px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.week{display:grid;grid-template-columns:52px repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);font-size:11px}
.week>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;min-height:34px;min-width:0}
.week .wh{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:6px}
.week .wh.today{color:var(--accent);font-weight:600}
.week .hr{color:var(--muted);font-size:10px}
/* Focus scene */
.scene{display:grid;grid-template-columns:1.05fr 1fr;gap:20px;align-items:center}
.scene svg{width:100%;border-radius:10px;display:block}
.timer{font-family:var(--serif);font-size:62px;text-align:center;letter-spacing:2px;line-height:1}
.mix-row{display:grid;grid-template-columns:24px 1fr 38px;gap:8px;align-items:center;margin-bottom:10px}
.mix-row .t{font-weight:500;font-size:13px}.mix-row .s{font-size:11px;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--gold)}
.spk{all:unset;cursor:pointer;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.spk.on{color:var(--ink);background:var(--card2)}
.spk svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8}
.blink{animation:blink 4s infinite}
@keyframes blink{0%,96%,100%{transform:scaleY(1)}98%{transform:scaleY(.1)}}
.rain line{animation:rain .9s linear infinite}
@keyframes rain{from{transform:translateY(-20px)}to{transform:translateY(60px)}}
.steam{animation:steam 3s ease-in-out infinite;opacity:.5}
@keyframes steam{0%{transform:translateY(0);opacity:0}50%{opacity:.6}100%{transform:translateY(-14px);opacity:0}}
.wave{animation:wave .8s ease-in-out 3;transform-origin:250px 238px}
@keyframes wave{50%{transform:rotate(-14deg)}}
.glow{animation:glow 5s ease-in-out infinite}
@keyframes glow{50%{opacity:.75}}
/* Vision board */
.vb-wrap{display:flex;justify-content:center;padding:10px 0}
.vb{position:relative;overflow:hidden;border-radius:6px;box-shadow:var(--shadow);user-select:none;touch-action:none}
.vb .tile{position:absolute;border-radius:6px;overflow:hidden;cursor:move;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--serif);padding:6px}
.vb .tile img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;pointer-events:none}
.vb .tile .rs{position:absolute;right:2px;bottom:2px;width:12px;height:12px;cursor:nwse-resize;border-right:2px solid rgba(255,255,255,.6);border-bottom:2px solid rgba(255,255,255,.6);z-index:2}
.vb .tile .x{position:absolute;top:3px;right:4px;font-size:12px;cursor:pointer;opacity:0;z-index:2;color:#fff;font-family:var(--sans)}
.vb .tile:hover .x{opacity:.8}
.vb .tile .cap{position:absolute;left:0;right:0;bottom:0;padding:4px;font-size:11px;background:linear-gradient(transparent,rgba(0,0,0,.55));color:#fff;z-index:1}
.vb-full{position:fixed;inset:0;z-index:60;background:#000;display:grid;place-items:center}
/* Overlays */
.overlay{position:fixed;inset:0;background:rgba(20,8,10,.45);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:8vh 16px}
.modal{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.3);width:min(560px,100%);padding:22px;max-height:84vh;overflow:auto}
.modal h2{font-family:var(--serif);font-weight:500;font-size:26px;margin:0 0 6px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--btn);color:var(--btnInk);padding:9px 16px;border-radius:999px;font-size:12.5px;z-index:70;box-shadow:var(--shadow)}
.sres{display:block;width:100%;text-align:left;all:unset;cursor:pointer;display:block;padding:8px 10px;border-radius:8px;border-bottom:1px solid var(--line)}
.sres:hover{background:var(--card2)}
.toggle{all:unset;cursor:pointer;width:38px;height:22px;border-radius:999px;background:var(--line2);position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on{background:var(--accent)}.toggle.on::after{left:19px}
.pad{width:100%;height:260px;background:var(--field);border:1px solid var(--line2);border-radius:10px;touch-action:none;cursor:crosshair}
.donut-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.kv>div{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.kv b{display:block;font-family:var(--serif);font-weight:500;font-size:20px}
.kv span{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mood{display:flex;gap:6px;flex-wrap:wrap}
.mood button{all:unset;cursor:pointer;width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-family:var(--serif);font-size:16px}
.mood button.on{background:var(--btn);color:var(--btnInk)}
.img-thumb{max-width:100%;max-height:120px;border-radius:6px;display:block;margin-top:4px}
audio{height:30px;max-width:100%;margin-top:4px}
@media (max-width:1050px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.span3{grid-column:span 2}.scene{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:250px;z-index:40;transform:translateX(-100%);transition:transform .25s}
  .side.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.4)}
  .burger{display:grid}
  .top{padding:16px 16px 12px}.top::after{left:16px;right:16px}.top h1{font-size:25px}
  .content{padding:14px 16px}
  .g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}.span2,.span3{grid-column:auto}
  .kanban{grid-template-columns:minmax(0,1fr)}
  .month .d{min-height:62px;padding:3px}.ev{font-size:9px;padding:1px 3px}
  .month .dh{padding:4px;font-size:9px;letter-spacing:0}
  .week{grid-template-columns:36px repeat(7,minmax(0,1fr));font-size:9px}
  .timer{font-size:50px}
  .top-actions .icon-btn{width:30px;height:30px}
}
.scrim{display:none}
@media (max-width:860px){.scrim.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:39}}
@media print{.side,.top-actions{display:none}.app{grid-template-columns:1fr}}

.side-date{margin-top:14px;display:inline-flex;align-items:baseline;gap:6px;flex-wrap:wrap;border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:6px 10px;font-size:11px;color:var(--sideMuted);background:rgba(0,0,0,.12)}
.side-date b{font-family:var(--serif);font-weight:500;font-size:20px;color:var(--sideInk);line-height:1}

function field(f,val){
  const v=val??f.def??'';const req=f.req?'required':'';
  let inp;
  if(f.type==='select')inp=`<select name="${f.k}" ${req}>${f.opts.map(o=>{const [ov,ol]=Array.isArray(o)?o:[o,o];return`<option value="${esc(ov)}" ${String(ov)===String(v)?'selected':''}>${esc(ol)}</option>`}).join('')}</select>`;
  else if(f.type==='textarea')inp=`<textarea name="${f.k}" placeholder="${esc(f.ph||'')}" ${req}>${esc(v)}</textarea>`;
  else inp=`<input type="${f.type||'text'}" name="${f.k}" value="${esc(v)}" placeholder="${esc(f.ph||'')}" ${f.type==='number'?'step="any"':''} ${req}>`;
  return `<div class="fld ${f.cls||''}">${f.label?`<label>${esc(f.label)}</label>`:''}${f.chips?chips():''}${inp}</div>`;
}

  return `<div class="card">${o.title?`<h2>${o.title}${o.right?`<small>${o.right}</small>`:''}</h2>`:''}

function barChart(data,{h=180,color='var(--c-money)',fmt=v=>v}={}){
  const W=600,H=h,pl=50,pb=22,pt=10;const max=Math.max(1,...data.map(d=>d.v));const bw=(W-pl-10)/data.length;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}">`;
  for(let i=0;i<=3;i++){const y=pt+(H-pt-pb)*(i/3);s+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pl-6}" y="${y+3}" text-anchor="end">${fmt(Math.round(max*(1-i/3)))}</text>`}
  data.forEach((d,i)=>{const bh=(H-pt-pb)*(d.v/max);const x=pl+i*bw+bw*.18;s+=`<rect x="${x}" y="${H-pb-bh}" width="${bw*.64}" height="${Math.max(0,bh)}" rx="3" fill="${d.c||color}"><title>${esc(d.l)}: ${fmt(d.v)}</title></rect><text x="${x+bw*.32}" y="${H-6}" text-anchor="middle">${esc(d.l)}</text>`});
  return s+'</svg>';
}
function lineChart(data,{h=170,color='var(--c-travel)',min=null,max=null,fill=true}={}){
  const W=600,H=h,pl=36,pb=22,pt=10;if(!data.length)return '<div class="empty">Log a few days to see the chart.</div>';
  const vs=data.map(d=>d.v);const mx=max??Math.max(1,...vs),mn=min??Math.min(0,...vs);const rng=mx-mn||1;
  const X=i=>pl+(W-pl-14)*(data.length===1?.5:i/(data.length-1)),Y=v=>pt+(H-pt-pb)*(1-(v-mn)/rng);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}">`;
  for(let i=0;i<=3;i++){const y=pt+(H-pt-pb)*(i/3);s+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pl-6}" y="${y+3}" text-anchor="end">${Math.round((mx-rng*i/3)*10)/10}</text>`}
  const pts=data.map((d,i)=>`${X(i)},${Y(d.v)}`).join(' ');
  if(fill)s+=`<polygon points="${X(0)},${H-pb} ${pts} ${X(data.length-1)},${H-pb}" fill="${color}" opacity=".12"/>`;
  s+=`<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2"/>`;
  data.forEach((d,i)=>{s+=`<circle cx="${X(i)}" cy="${Y(d.v)}" r="3" fill="var(--card)" stroke="${color}" stroke-width="2"><title>${esc(d.l)}: ${d.v}</title></circle><text x="${X(i)}" y="${H-6}" text-anchor="middle">${esc(d.l)}</text>`});
  return s+'</svg>';
}
function donut(parts,size=150){
  const tot=parts.reduce((a,p)=>a+p.v,0);if(!tot)return `<svg width="${size}" height="${size}" viewBox="0 0 42 42"><circle cx="21" cy="21" r="15.9" fill="none" stroke="var(--line)" stroke-width="6"/></svg>`;
  let off=25,s=`<svg width="${size}" height="${size}" viewBox="0 0 42 42">`;
  parts.forEach(p=>{const pct=p.v/tot*100;s+=`<circle cx="21" cy="21" r="15.9" fill="none" stroke="${p.c}" stroke-width="6" stroke-dasharray="${pct} ${100-pct}" stroke-dashoffset="${off}"><title>${esc(p.l)}</title></circle>`;off-=pct});
  return s+'</svg>';
}

const REMIND=[['','Default'],['none','No reminder'],['0','At start time'],['5','5 min before'],['10','10 min before'],['15','15 min before'],['30','30 min before'],['60','1 hour before'],['120','2 hours before'],['1440','1 day before']];
const FREQ=[['once','Once'],['daily','Daily'],['weekly','Weekly'],['fortnightly','Fortnightly'],['monthly','Monthly'],['quarterly','Quarterly'],['yearly','Yearly']];
function step(s,f,dir=1){return f==='daily'?addDays(s,dir):f==='weekly'?addDays(s,7*dir):f==='fortnightly'?addDays(s,14*dir):f==='monthly'?addMonths(s,dir):f==='quarterly'?addMonths(s,3*dir):f==='yearly'?addMonths(s,12*dir):null}
function occur(start,f,from,to){const out=[];if(!start)return out;if(!f||f==='once'){if(start>=from&&start<=to)out.push(start);return out}
  let d=start,guard=0;
  if(d<from){ // fast-forward
    if(f==='yearly'){const y=parse(from).getFullYear();d=`${y}${start.slice(4)}`;if(d<from)d=`${y+1}${start.slice(4)}`;if(d<start)d=start}
    else while(d<from&&guard++<2000)d=step(d,f)}
  while(d<=to&&guard++<4000){out.push(d);d=step(d,f)}return out}

function quotePool(){const own=(S.quotes.own||[]).map(q=>[q.text,q.by||'Me']);return S.quotes.onlyOwn&&own.length?own:QUOTES.concat(own)}
function seededOrder(n,seed){const a=[...Array(n).keys()];let s=seed;for(let i=n-1;i>0;i--){s=(s*9301+49297)%233280;const j=Math.floor(s/233280*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function quoteOfDay(d=today()){const pool=quotePool();const day=Math.floor(parse(d).getTime()/864e5);const cyc=Math.floor(day/pool.length);const order=seededOrder(pool.length,(cyc+7)*131);const off=(S.quotes.skip||{})[d]||0;return pool[order[(day+off)%pool.length]]}

  if(kind==='unit'){const f=findUnit(id);return f?f.u.status==='done':null}
  if(kind==='trip'){const [tid,bid,k]=id.split('~');const b=(S.travel.trips.find(x=>x.id===tid)?.bookings||[]).find(x=>x.id===bid);if(!b)return null;return k==='book'?b.status!=='tobook':k==='dep'?(b.status==='deposit'||b.status==='paid'):b.status==='paid'}
  if(kind==='plan'){const p=S.planned.find(x=>x.id===id);return p?!!p.done:null}
  if(kind==='card'){const c=allCards().find(x=>x.id===id);return c?c.col==='done':null}

function noiseBuf(c,kind){const len=c.sampleRate*4,b=c.createBuffer(2,len,c.sampleRate);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);let last=0,b0=0,b1=0,b2=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;if(kind==='brown'){last=(last+.02*w)/1.02;d[i]=last*3.5}else if(kind==='pink'){b0=.99765*b0+w*.099;b1=.963*b1+w*.2965;b2=.57*b2+w*1.0526;d[i]=(b0+b1+b2+w*.1848)*.11}else d[i]=w*.35}}return b}
function startLayer(k){const c=ac();const g=c.createGain();g.gain.value=(S.focus.mix[k]/100)**1.6*.9;g.connect(master());const src=c.createBufferSource();src.loop=true;let extra=null;

  else if(k==='white'){src.buffer=noiseBuf(c,'white');const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=9000;src.connect(f).connect(g)}
  else if(k==='rain'){src.buffer=noiseBuf(c,'pink');const hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=900;const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=7000;src.connect(hp).connect(lp).connect(g);
    extra=setInterval(()=>{const o=c.createBufferSource();o.buffer=noiseBuf.cache||(noiseBuf.cache=noiseBuf(c,'white'));const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=2000+Math.random()*3000;const gg=c.createGain();gg.gain.setValueAtTime(.12*(S.focus.mix.rain/100),c.currentTime);gg.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.04);o.connect(bp).connect(gg).connect(master());o.start(c.currentTime,Math.random()*3,.05)},70)}
  else if(k==='academia'){const r=academia(c,g);src.buffer=r.crackle;src.connect(r.crackleGain);extra=r.timer}

function academia(c,out){

  const wet=c.createGain();wet.gain.value=.55;const dry=c.createGain();dry.gain.value=.7;rev.connect(wet).connect(comp);dry.connect(comp);
  const bus=c.createGain();bus.gain.value=.6;bus.connect(dry);bus.connect(rev);
  const hz=m=>440*Math.pow(2,(m-69)/12);

  const scale=[69,71,72,74,76,77,79,81];
  function piano(m,t,v=.16,dur=3.2){const o=c.createOscillator(),o2=c.createOscillator(),f=c.createBiquadFilter(),g=c.createGain();o.type='triangle';o2.type='sine';o.frequency.value=hz(m);o2.frequency.value=hz(m)*2.001;f.type='lowpass';f.frequency.setValueAtTime(2600,t);f.frequency.exponentialRampToValueAtTime(700,t+dur);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);const g2=c.createGain();g2.gain.value=.25;o.connect(f);o2.connect(g2).connect(f);f.connect(g).connect(bus);o.start(t);o2.start(t);o.stop(t+dur+.1);o2.stop(t+dur+.1)}
  function cello(m,t,dur){const o=c.createOscillator(),f=c.createBiquadFilter(),g=c.createGain(),lfo=c.createOscillator(),lg=c.createGain();o.type='sawtooth';o.frequency.value=hz(m);lfo.frequency.value=5;lg.gain.value=hz(m)*.006;lfo.connect(lg).connect(o.frequency);f.type='lowpass';f.frequency.value=520;f.Q.value=.8;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.07,t+1.4);g.gain.setValueAtTime(.07,t+dur-1.2);g.gain.linearRampToValueAtTime(0,t+dur);o.connect(f).connect(g).connect(bus);o.start(t);lfo.start(t);o.stop(t+dur+.1);lfo.stop(t+dur+.1)}

/* ============ KANBAN (shared by Home & Career) ============ */
function kanban(mod,title,hint){
  const boards=S.boards.filter(b=>b.module===mod);let cur=boards.find(b=>b.id===UI.board[mod])||boards[0];
  const cols=[['todo','To do'],['doing','In progress'],['done','Done']];
  return `<div class="card"><h2>${title}<form data-form="newBoard" data-mod="${mod}" class="row"><input type="text" name="name" placeholder="New board name" style="width:170px" required><button class="btn ghost sm">New board</button></form></h2>
  <div class="note">${hint}</div>
  <div class="row" style="margin-bottom:12px">${boards.map(b=>`<button class="pill ${cur&&b.id===cur.id?'on':''}" data-act="pickBoard" data-mod="${mod}" data-id="${b.id}">${esc(b.name)}</button>`).join('')}${cur?`<span class="spacer"></span><button class="btn danger sm" data-act="delBoard" data-id="${cur.id}">Delete board</button>`:''}</div>
  ${cur?`<form class="form" data-form="card" data-board="${cur.id}"><div class="fld wide">${chips()}<input type="text" name="title" placeholder="Card title" required></div>${field({k:'notes',ph:'Notes'})}${field({k:'prio',type:'select',opts:[['low','Low'],['med','Med'],['high','High']],def:'med',cls:'narrow'})}${field({k:'due',type:'date',cls:'narrow'})}<button class="btn">Add card</button></form>
  <div class="kanban">${cols.map(([k,l])=>{const cs=cur.cards.filter(c=>c.col===k);return `<div class="col" data-drop="${cur.id}" data-col="${k}"><div class="col-h"><span>${l}</span><span>${cs.length}</span></div>
   ${cs.map(c=>`<div class="kcard" draggable="true" data-card="${c.id}"><div class="t"><span>${esc(c.title)}</span><span class="tag ${c.prio}">${c.prio||''}</span></div>${c.notes?`<div class="s">${esc(c.notes)}</div>`:''}<div class="s row" style="justify-content:space-between">${c.due?`<span>${fmtShort(c.due)}</span>`:'<span></span>'}<span>${k!=='todo'?`<button class="del" data-act="moveCard" data-id="${c.id}" data-dir="-1" title="Move left">‹</button>`:''}${k!=='done'?`<button class="del" data-act="moveCard" data-id="${c.id}" data-dir="1" title="Move right">›</button>`:''}<button class="del" data-act="delCard" data-id="${c.id}">${icon('trash')}</button></span></div></div>`).join('')}
   ${!cs.length?'<div class="addcard">Drop cards here</div>':''}</div>`}).join('')}</div>`:'<div class="empty">Make your first board.</div>'}</div>`;
}

const CATS=['Groceries','Eating out','Transport','Home','Utilities','Health','Beauty','Clothing','Entertainment','Travel','Gifts','Education','Business','Other'];
const monthlyOf=(amt,f)=>{amt=num(amt);return f==='weekly'?amt*52/12:f==='fortnightly'?amt*26/12:f==='daily'?amt*30:f==='quarterly'?amt/3:f==='yearly'?amt/12:f==='once'?0:amt};

  let h=tabs('money',[['overview','Overview'],['income','Income'],['bills','Bills'],['expenses','Expenses'],['savings','Savings'],['subs','Subscriptions'],['debt','Debt']]);
  const inc=S.money.income.reduce((a,i)=>a+monthlyOf(i.amount,i.freq),0);const spend=spendMonth();
  const billsDue=S.money.bills.filter(b=>occur(b.due,b.freq,mk+'-01',mk+'-31').length).reduce((a,b)=>a+num(b.amount),0);

  if(tab==='overview'){const cap=num(S.settings.spendCap);const byCat={};S.money.expenses.filter(e=>monthKey(e.date)===mk).forEach(e=>byCat[e.cat]=(byCat[e.cat]||0)+num(e.amount));
    const parts=Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([l,v],i)=>({l,v,c:PAL[i%PAL.length]}));
    h+=`<div class="grid g4"><div class="card"><div class="kicker">In · monthly</div><div class="stat">${money(inc)}</div></div><div class="card"><div class="kicker">Spend this month</div><div class="stat">${money(spend)}</div></div><div class="card"><div class="kicker">Bills this month</div><div class="stat">${money(billsDue)}</div></div><div class="card"><div class="kicker">Subscriptions /mo</div><div class="stat">${money(subs)}</div></div></div>
    <div class="card" style="margin-top:16px"><h2>Monthly spend cap<small>${cap?`${money(Math.max(0,cap-spend))} left`:''}</small></h2><div class="note">One number. It repeats every month by existing. Expenses count against it.</div>
     <form class="form" data-form="setting"><div class="fld narrow"><input type="number" name="spendCap" value="${cap||''}" placeholder="${S.settings.currency} cap"></div><button class="btn">Set cap</button></form>${cap?bar(spend,cap):''}</div>

     <div class="card"><h2>Spend by category</h2>${parts.length?`<div class="donut-wrap">${donut(parts,160)}${legend(parts)}</div>`:'<div class="empty">Log expenses to see the split.</div>'}</div></div>`}
  if(tab==='income')h+=crud({title:'Income streams',path:'money.income',right:money(inc)+' / month',fields:[{k:'source',label:'Source',req:1,ph:'Salary, freelance, rent'},{k:'amount',label:'Amount',type:'number',req:1},{k:'freq',label:'Frequency',type:'select',opts:FREQ,def:'monthly'},{k:'next',label:'Next payday',type:'date',def:t}],
    row:i=>`<div class="t">${esc(i.source)} · ${money(i.amount)}</div><div class="s">${i.freq} · next ${fmtShort(i.next)} · ≈ ${money(monthlyOf(i.amount,i.freq))}/mo</div>`,note:'Paydays land on the calendar and roll forward.'});
  if(tab==='bills')h+=crud({title:'Bills',path:'money.bills',right:money(S.money.bills.reduce((a,b)=>a+monthlyOf(b.amount,b.freq),0))+' / month',fields:[{k:'name',label:'Bill',req:1},{k:'amount',label:'Amount',type:'number',req:1},{k:'due',label:'Next due',type:'date',def:t},{k:'freq',label:'Repeats',type:'select',opts:FREQ,def:'monthly'},{k:'cat',label:'Category',type:'select',opts:CATS,def:'Utilities'}],
    sort:(a,b)=>(a.due||'').localeCompare(b.due||''),row:b=>{const d=diffDays(t,b.due);return `<div class="t">${esc(b.name)} · ${money(b.amount)} ${d<0?'<span class="tag high">overdue</span>':d<=3?'<span class="tag med">soon</span>':''}</div><div class="s">${b.freq} · due ${fmtD(b.due)} (${d<0?Math.abs(d)+' days late':d===0?'today':'in '+d+' days'})</div>`},
    actions:b=>`<button class="btn sm" data-act="payBill" data-id="${b.id}">Paid</button>`,note:'Hit Paid: it logs the expense and rolls the due date forward by itself.'});
  if(tab==='expenses'){h+=crud({title:'Expenses',path:'money.expenses',right:money(spend)+' this month',fields:[{k:'desc',label:'What',req:1},{k:'amount',label:'Amount',type:'number',req:1},{k:'cat',label:'Category',type:'select',opts:CATS},{k:'date',label:'Date',type:'date',def:t}],
    filter:e=>e.date>=addDays(t,-60),sort:(a,b)=>b.date.localeCompare(a.date),row:e=>`<div class="t">${esc(e.desc)} · ${money(e.amount)}</div><div class="s">${fmtD(e.date)} · ${e.cat}</div>`,note:'Showing the last 60 days. Export keeps everything.'})}
  if(tab==='savings')h+=crud({title:'Savings goals',path:'money.goals',fields:[{k:'name',label:'Goal',req:1,ph:'Emergency fund'},{k:'target',label:'Target',type:'number',req:1},{k:'saved',label:'Saved so far',type:'number',def:0},{k:'by',label:'By',type:'date'}],
    row:g=>{const left=num(g.target)-num(g.saved);const months=g.by?Math.max(1,Math.ceil(diffDays(t,g.by)/30)):0;return `<div class="t">${esc(g.name)} · ${money(g.saved)} of ${money(g.target)}</div>${bar(num(g.saved),num(g.target))}<div class="s">${Math.round(num(g.saved)/Math.max(1,num(g.target))*100)}%${g.by&&left>0?` · ${money(left/months)}/month to hit ${fmtD(g.by)}`:''}</div>`},

  if(tab==='subs')h+=crud({title:'Subscriptions',path:'money.subs',right:money(subs)+' / month · '+money(subs*12)+' / year',fields:[{k:'name',label:'Service',req:1},{k:'amount',label:'Amount',type:'number',req:1},{k:'cycle',label:'Cycle',type:'select',opts:[['monthly','Monthly'],['yearly','Yearly'],['weekly','Weekly']]},{k:'renews',label:'Renews',type:'date',def:t},{k:'keep',label:'Verdict',type:'select',opts:['Keep','Review','Cancel']}],
    row:s=>`<div class="t">${esc(s.name)} · ${money(s.amount)}/${s.cycle==='yearly'?'yr':s.cycle==='weekly'?'wk':'mo'} <span class="tag ${s.keep==='Cancel'?'high':s.keep==='Review'?'med':''}">${s.keep||'Keep'}</span></div><div class="s">renews ${fmtD(s.renews)}</div>`,note:'Auto-totalled. Tag anything you would not buy again today.'});
  if(tab==='debt'){const tot=S.money.debt.reduce((a,d)=>a+num(d.balance),0);
    h+=crud({title:'Debt',path:'money.debt',right:money(tot)+' total',fields:[{k:'name',label:'Debt',req:1},{k:'balance',label:'Balance',type:'number',req:1},{k:'rate',label:'APR %',type:'number'},{k:'min',label:'Min payment',type:'number'}],
      sort:(a,b)=>num(b.rate)-num(a.rate),row:d=>{const r=num(d.rate)/1200,p=num(d.min);let n='—';if(p>0){if(r===0)n=Math.ceil(num(d.balance)/p);else if(p>num(d.balance)*r)n=Math.ceil(-Math.log(1-r*num(d.balance)/p)/Math.log(1+r))}return `<div class="t">${esc(d.name)} · ${money(d.balance)}</div><div class="s">${d.rate||0}% APR · min ${money(d.min)} · ${n==='—'?'payment too low to clear':n+' months to clear at minimum'}</div>`},
      actions:d=>`<form data-form="payDebt" data-id="${d.id}" class="row" style="flex-wrap:nowrap"><input type="number" name="amt" placeholder="Pay" style="width:80px" step="any" required><button class="btn sm">Pay</button></form>`,note:'Sorted avalanche-style: highest interest first.'})}
  return h;
};

function vbCanvas(){const B=S.goals.board;const [W,H]=SIZES[B.size];const P=PAPERS[B.paper];const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.fillStyle=P[0];x.fillRect(0,0,W,H);
  const rr=(X,Y,w,h,r)=>{x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath()};
  const imgs=B.tiles.filter(t=>t.type==='img').map(t=>new Promise(res=>{const i=new Image();i.onload=()=>res([t.id,i]);i.onerror=()=>res([t.id,null]);i.src=t.src}));
  return Promise.all(imgs).then(arr=>{const M=Object.fromEntries(arr);B.tiles.forEach(t=>{const X=t.x/100*W,Y=t.y/100*H,w=t.w/100*W,h=t.h/100*H,r=W*.008;x.save();rr(X,Y,w,h,r);x.clip();
    if(t.type==='img'&&M[t.id]){const im=M[t.id];const s=Math.max(w/im.width,h/im.height);x.drawImage(im,X+(w-im.width*s)/2,Y+(h-im.height*s)/2,im.width*s,im.height*s);if(t.cap){x.fillStyle='rgba(0,0,0,.45)';x.fillRect(X,Y+h-h*.18,w,h*.18);x.fillStyle='#fff';x.font=`${Math.round(W/34)}px 'Cormorant Garamond',Georgia,serif`;x.textAlign='center';x.textBaseline='middle';x.fillText(t.cap,X+w/2,Y+h-h*.09)}}
    else{x.fillStyle=P[2];x.fillRect(X,Y,w,h);x.fillStyle=P[1];const fs=Math.round(B.size==='phone'?W/16:W/30);x.font=`${fs}px 'Cormorant Garamond',Georgia,serif`;x.textAlign='center';x.textBaseline='middle';
      const words=String(t.text).split(' ');const lines=[];let l='';words.forEach(wd=>{const tr=l?l+' '+wd:wd;if(x.measureText(tr).width>w*.9&&l){lines.push(l);l=wd}else l=tr});lines.push(l);lines.forEach((ln,i)=>x.fillText(ln,X+w/2,Y+h/2+(i-(lines.length-1)/2)*fs*1.2))}
    x.restore()});return c})}

};

/* ============ EMAIL ============ */
const MONTHIDX={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,sept:8,oct:9,nov:10,dec:11};
const DOWIDX={sun:0,mon:1,tue:2,tues:2,wed:3,thu:4,thur:4,thurs:4,fri:5,sat:6};
function parseInvite(raw){
  let txt=String(raw||'');const out={title:'',date:'',time:'',end:'',link:'',location:'',notes:''};
  if(/BEGIN:VEVENT/.test(txt)){const ev=parseIcs(txt)[0];if(ev)return {...out,...ev}}
  const lines=txt.split(/\r?\n/).map(l=>l.trim());
  const subj=lines.find(l=>/^(subject|onderwerp|betreff)\s*:/i.test(l));
  out.title=(subj?subj.replace(/^[^:]+:\s*/,''):(()=>{let l=(lines.find(l=>l.length>3&&!/^(from|to|cc|date|sent)\s*:/i.test(l)&&!/^(hi|hello|hey|dear|good (morning|afternoon))\b[^,]*,?$/i.test(l))||'').replace(/https?:\/\/\S+/g,'').replace(/^(hi|hello|hey|dear|good (morning|afternoon))\b[^,]*,\s*/i,'');l=l.split(/[?.!](\s|$)/)[0].trim();return l.length>60?l.slice(0,57)+'…':l})()).replace(/^(invitation|updated invitation|meeting|fw|fwd|re)\s*:\s*/i,'').replace(/\s*@\s.*$/,'').slice(0,90);
  const loc=lines.find(l=>/^(location|where|venue)\s*:/i.test(l));if(loc)out.location=loc.replace(/^[^:]+:\s*/,'');
  const urls=txt.match(/https?:\/\/[^\s<>"')]+/g)||[];out.link=urls.find(u=>/zoom\.us|meet\.google|teams\.microsoft|teams\.live|webex|whereby|gotomeet/i.test(u))||'';
  // strip header Date: lines (that's when the email was sent, not the meeting)
  const body=lines.filter(l=>!/^(date|sent)\s*:/i.test(l)).join(' \n ');
  const now=new Date();let d=null,m;
  if(m=body.match(/\b(20\d\d)-(\d\d)-(\d\d)\b/))d=new Date(+m[1],+m[2]-1,+m[3]);
  else if(m=body.match(/\b(\d{1,2})[\/.](\d{1,2})[\/.](20\d\d|\d\d)\b/)){const y=+m[3]<100?2000+ +m[3]:+m[3];d=new Date(y,+m[2]-1,+m[1])}
  else if(m=body.match(/\b(\d{1,2})(?:st|nd|rd|th)?\s+(jan|feb|mar|apr|may|jun|jul|aug|sept?|oct|nov|dec)[a-z]*\.?,?\s*(20\d\d)?/i)){d=new Date(m[3]?+m[3]:now.getFullYear(),MONTHIDX[m[2].toLowerCase()],+m[1]);if(!m[3]&&d<new Date(now.getFullYear(),now.getMonth(),now.getDate()))d.setFullYear(d.getFullYear()+1)}
  else if(m=body.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sept?|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})(?:st|nd|rd|th)?,?\s*(20\d\d)?/i)){d=new Date(m[3]?+m[3]:now.getFullYear(),MONTHIDX[m[1].toLowerCase()],+m[2]);if(!m[3]&&d<new Date(now.getFullYear(),now.getMonth(),now.getDate()))d.setFullYear(d.getFullYear()+1)}
  else if(/\btomorrow\b/i.test(body)){d=new Date();d.setDate(d.getDate()+1)}
  else if(/\btoday\b/i.test(body))d=new Date();
  else if(m=body.match(/\b(?:on|this|next)?\s*(sun|mon|tues?|wed|thu(?:rs?)?|fri|sat)[a-z]*\b/i)){const w=DOWIDX[m[1].toLowerCase()];d=new Date();let add=(w-d.getDay()+7)%7||7;d.setDate(d.getDate()+add)}
  if(d)out.date=iso(d);
  const tm=[...body.matchAll(/\b(\d{1,2})(?:[:h.](\d{2}))?\s*(am|pm|a\.m\.|p\.m\.)?(?=\b|\s|$)/gi)].filter(x=>(x[2]||x[3])&&+x[1]<=24&&!(x[2]&&+x[2]>59));
  const toT=x=>{let h=+x[1];const mm=x[2]||'00';const ap=(x[3]||'').toLowerCase().replace(/\./g,'');if(ap==='pm'&&h<12)h+=12;if(ap==='am'&&h===12)h=0;return pad2(h)+':'+mm};
  if(tm[0])out.time=toT(tm[0]);if(tm[1])out.end=toT(tm[1]);
  out.notes=[out.location&&('Where: '+out.location)].filter(Boolean).join('\n');
  return out}

const FILES={db:null,open(){return this.db?Promise.resolve(this.db):new Promise((res,rej)=>{try{const r=indexedDB.open(KEY+'-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>rej(r.error)}catch(e){rej(e)}})},
  async put(id,blob){const db=await this.open();return new Promise((res,rej)=>{const tx=db.transaction('f','readwrite');tx.objectStore('f').put(blob,id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})},
  async get(id){const db=await this.open();return new Promise((res,rej)=>{const q=db.transaction('f').objectStore('f').get(id);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
  async del(id){try{const db=await this.open();db.transaction('f','readwrite').objectStore('f').delete(id)}catch(e){}},
  async all(){const db=await this.open();return new Promise(res=>{const out={};const c=db.transaction('f').objectStore('f').openCursor();c.onsuccess=e=>{const cur=e.target.result;if(cur){out[cur.key]=cur.value;cur.continue()}else res(out)}})}};

async function firstLinkChoice(remote){/* first sign-in on a device that already has data */
  const hasLocal=(S.capture.length+S.planned.length+S.notes.items.length+S.calendar.events.length+S.money.bills.length)>0&&S.settings.setup;
  if(!remote||!remote.chunks){await Cloud.push(buildPayload());return}
  if(!hasLocal){Object.keys(syncMeta().t).forEach(k=>syncMeta().t[k]=0);applyRemote(remote);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render();return}
  const when=remote.at?new Date(remote.at).toLocaleString():'';
  modal(`<h2>Which planner should we keep?</h2><div class="note">Your account already has a planner${remote.device?` from <b>${esc(remote.device.name)}</b>`:''}${when?' (last synced '+esc(when)+')':''}, and this device has its own data.</div>
   <div class="grid g3" style="margin-top:10px"><button class="choice on" data-act="syncPick" data-v="cloud"><b>Use the cloud planner</b><span>Replace this device’s data with your synced planner. Recommended for a new phone.</span></button>
   <button class="choice" data-act="syncPick" data-v="merge"><b>Merge both</b><span>Keep the newest version of each section from both.</span></button>
   <button class="choice" data-act="syncPick" data-v="local"><b>Use this device</b><span>Upload this device’s planner and replace the cloud copy.</span></button></div>`,false);
  SY.pendingRemote=remote}

let _fontKey=null;

  st.textContent=d?`@font-face{font-family:'UserHeading';src:url(${d});font-display:swap}:root{--serif:'UserHeading','Cormorant Garamond',Georgia,serif}.stat,.timer,.kv b,.month .d .n{font-family:'Cormorant Garamond',Georgia,serif}`:''}

    <div class="mono ${st.iconData?'has-img':''}" data-act="settings" title="Personalise">${st.iconData?`<img src="${st.iconData}" alt="">`:esc(initials(st.owner))}</div>
    ${st.owner?`<div class="owner">${esc(st.owner)}’s planner</div>`:'<div class="owner">Your planner</div>'}
    <div class="brand1">${esc(st.title1)}</div><div class="brand2">${esc(st.title2)}</div><div class="tagline">${esc(st.tagline)}</div><div class="side-date"><span>${["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][new Date().getDay()]}</span><b>${new Date().getDate()}</b><span>${MONTHS[new Date().getMonth()]} ${new Date().getFullYear()}</span></div>
    <nav class="nav">${vis.map(m=>`<button class="${m[0]===UI.route?'on':''}" data-act="go" data-v="${m[0]}">${icon(m[0])}${m[1]}</button>`).join('')}</nav>
    <div class="side-foot"><button data-act="settings">${icon('atelier')}Atelier</button></div>
   </aside><div class="scrim" id="scrim" data-act="closeSide"></div>
   <main class="main"><header class="top"><div class="row" style="flex-wrap:nowrap;align-items:flex-start"><button class="icon-btn burger" data-act="openSide" aria-label="Menu">${icon('menu')}</button><div>${UI.route==="dashboard"?`<div class="top-date">${longDate()}</div>`:""}<h1>${M[2]}</h1><p>${M[3]}</p></div></div>
    <div class="top-actions"><button class="icon-btn cloud-btn st-${typeof SY!=="undefined"?SY.status:"off"}" data-act="sync" title="${typeof SY!=="undefined"?esc(syncTitle()):""}">${icon('cloud')}</button><button class="icon-btn" data-act="search" title="Search (/)">${icon('search')}</button><button class="icon-btn bell" data-act="reminders" title="Reminders">${icon('bell')}${upcomingReminders(24*60).length?`<span class="badge">${upcomingReminders(24*60).length}</span>`:''}</button><div class="vol"><button class="icon-btn ring ${st.muted?"":"live"}" data-act="sounds" title="${st.muted?"Unmute":"Mute all sound"} · hover for volume" aria-label="Sound">${icon(st.muted?"mute":"sound")}</button><div class="vol-pop"><div><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><span class="kicker">Volume</span><span class="small muted" id="volv">${st.muted?"Muted":(st.volume??80)+"%"}</span></div><input type="range" min="0" max="100" value="${st.volume??80}" data-vol="1" aria-label="Volume"><div class="small muted" style="margin-top:4px">Mixer, chime and clicks. Tap the speaker to mute everything.</div></div></div></div><button class="icon-btn" data-act="theme" title="Dark / light">${icon(st.dark?'sun':'moon')}</button></div></header>
    <div class="content">${VIEWS[UI.route]()}</div></main></div>`;
  window.scrollTo(0,y);
  document.title=S.settings.title1+' '+S.settings.title2;
  setFavicon();
  if(UI.route==='goals'&&curTab('goals','life')==='vision')vbBind();
  if(UI.route==='notes')$$('.sec-text').forEach(t=>{t.style.height='auto';t.style.height=Math.max(90,t.scrollHeight+4)+'px'});
}

const ACT={
 sync:()=>openSync(),syncHelp:()=>openSyncHelp(),syncBack:()=>openSync(),
 syncForget:()=>{lsSet(CLOUDK,null);SY.cfg=null;openSync()},
 syncNowBtn:()=>syncNow({push:1}),

 syncLink:()=>{const c=cloudCfg();if(location.protocol==='file:'){toast('Open your planner from your website (e.g. yourname.netlify.app) to create the phone link.');return}const u=location.origin+location.pathname+'#sync='+encodeURIComponent(btoa(c.url+'|'+c.key));(navigator.share?navigator.share({title:'Planner sync',url:u}).catch(()=>{}):navigator.clipboard.writeText(u).then(()=>toast('Link copied — open it on your phone.')))},
 syncPick:async el=>{const r=SY.pendingRemote;SY.pendingRemote=null;const v=el.dataset.v;const m=syncMeta();

   try{await Cloud.push(buildPayload());localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}closeModal();render();startSync();toast('You’re synced ✓')},
 go:el=>{UI.route=el.dataset.v;window.scrollTo(0,0);render();tick(520)},

 theme:()=>{S.settings.dark=!S.settings.dark;rerender()},
 sounds:()=>{S.settings.muted=!S.settings.muted;ac();if(S.settings.muted){MIX.resume=Object.keys(MIX.nodes);MIX.resume.forEach(stopLayer)}else{if(!num(S.settings.volume))S.settings.volume=60;master();(MIX.resume||[]).forEach(k=>{if(!MIX.nodes[k])startLayer(k)});MIX.resume=[]}master();rerender();if(!S.settings.muted)tick(700);toast(S.settings.muted?'All sound off.':'Sound on.')},
 capEdit:el=>{const c=findIn('capture',el.dataset.id);modal(`<h2>Edit capture</h2><form class="form" data-form="capEdit" data-id="${c.id}">${field({k:'text',label:'What',req:1,cls:'full'},c.text)}${field({k:'due',label:'Date',type:'date'},c.due)}${field({k:'time',label:'Time',type:'time'},c.time)}${field({k:'prio',label:'Priority',type:'select',opts:[['','None'],['high','High'],['med','Medium'],['low','Low']]},c.prio)}${field({k:'notes',label:'Extra info',type:'textarea',cls:'full',ph:'Links, details, who to call…'},c.notes)}<button class="btn">Save</button><button type="button" class="btn ghost" data-act="closeModal">Cancel</button></form><div class="note">With a date it shows in Today’s tasks on that day and on the calendar.</div>`)},
 planToday:(el,e)=>{e.stopPropagation();const ev={date:el.dataset.d,title:el.dataset.title};const key=plannedKey(ev);if(S.planned.some(p=>p.key===key&&p.date===today()))return toast('Already in today’s tasks.');S.planned.push({id:uid(),key,title:el.dataset.title,mod:el.dataset.mod,from:el.dataset.d,time:el.dataset.time,date:today(),done:false});rerender();tick(820);toast('Added to today’s tasks.')},
 undoTask:el=>{const k=el.dataset.kind,id=el.dataset.id,t=today();const h=(S.history[t]||{})[k+':'+id];const prev=h&&h.prev;
   if(k==='cap'){const c=findIn('capture',id);if(c)c.done=false}
   if(k==='edu'){const r=findIn('education.reminders',id);if(r)r.done=false}
   if(k==='plan'){const p=findIn('planned',id);if(p)p.done=false}
   if(k==='trip'){const [tid,bid]=id.split('~');const b=(findIn('travel.trips',tid)?.bookings||[]).find(x=>x.id===bid);if(b&&prev)b.status=prev.status}
   if(k==='unit'){const f=findUnit(id);if(f)setUnit(f.c,f.u,prev&&prev.status!=='done'?prev.status:'doing')}
   if(k==='card'){for(const b of S.boards){const c=b.cards.find(x=>x.id===id);if(c)c.col=prev?.col&&prev.col!=='done'?prev.col:'todo'}}
   if(k==='chore'){const c=findIn('home.chores',id);if(c){if(prev)Object.assign(c,prev);else{c.last='';c.next=t;c.streak=Math.max(0,num(c.streak)-1)}}}
   if(k==='groom'){const g=findIn('self.grooming',id);if(g)g.last=prev?prev.last:addDays(t,-(num(g.every)||7))}
   if(h){h.done=false;h.at='';delete h.prev}
   $$('.toast').forEach(x=>x.remove());rerender();tick(440);toast('Back on today’s list.')},
 unitToggle:(el,e)=>{e.preventDefault();UI.unitOpen=UI.unitOpen||{};UI.unitOpen[el.dataset.id]=!UI.unitOpen[el.dataset.id];render()},
 unitCycle:el=>{const c=findIn('education.courses',el.dataset.c);const u=c.units.find(x=>x.id===el.dataset.u);setUnit(c,u,u.status==='todo'?'doing':u.status==='doing'?'done':'todo');rerender();tick(u.status==='done'?880:600)},

 unitEdit:el=>{const c=findIn('education.courses',el.dataset.c);const u=c.units.find(x=>x.id===el.dataset.u);modal(`<h2>Edit unit</h2><div class="note">${esc(c.name)}</div><form class="form" data-form="unitEdit" data-c="${c.id}" data-u="${u.id}">${field({k:'title',label:'Unit',req:1,cls:'full'},u.title)}${field({k:'due',label:'Due date',type:'date'},u.due)}${field({k:'status',label:'Status',type:'select',opts:[['todo','Not started'],['doing','In progress'],['done','Done']]},u.status)}<button class="btn">Save</button><button type="button" class="btn ghost" data-act="closeModal">Cancel</button></form>`)},
 toggleDone:(el,e)=>{e.preventDefault();UI.doneOpen=!UI.doneOpen;render()},
 histRange:el=>{UI.histRange=el.dataset.v;UI.histDay='';render()},
 carryOver:el=>{S.planned.push({id:uid(),key:'carry|'+el.dataset.title+'|'+today(),title:el.dataset.title,mod:'history',from:'',date:today(),done:false});rerender();toast('Carried over to today.')},
 dashCal:el=>{const v=+el.dataset.v;UI.dashCal=v===0?today():addMonths((UI.dashCal||today()).slice(0,8)+'01',v);render()},
 eduProg:el=>{const c=findIn('education.courses',el.dataset.id);c.progress=Math.max(0,Math.min(100,num(c.progress)+ +el.dataset.v));if(c.progress>=100){c.status='Completed';chime()}rerender()},

 del:el=>{const arr=get(el.dataset.path);const i=arr.findIndex(x=>x.id===el.dataset.id);if(i<0)return;lastDeleted={path:el.dataset.path,item:arr[i],i};arr.splice(i,1);rerender();tick(300);undoToast()},

 capDone:el=>{const c=findIn('capture',el.dataset.id);c.done=!c.done;rerender();tick(c.done?880:440)},
 doTask:el=>{const id=el.dataset.id,k=el.dataset.kind,t=today();const H=S.history[t]||(S.history[t]={});const key=k+':'+id;let prev=null;
   if(k==='chore'){const c=findIn('home.chores',id);prev={streak:c.streak,last:c.last,next:c.next};c.streak=c.next>=t?(num(c.streak)+1):1;c.last=t;let n=c.next;let g=0;while(n<=t&&g++<500)n=step(n,c.freq)||addDays(t,7);c.next=n}
   if(k==='card'){const c=allCards().find(x=>x.id===id);const real=c.board.cards.find(x=>x.id===id);prev={col:real.col};real.col='done'}
   if(k==='groom'){const g=findIn('self.grooming',id);prev={last:g.last};g.last=t}
   if(k==='cap'){findIn('capture',id).done=true}
   if(k==='edu'){findIn('education.reminders',id).done=true}
   if(k==='plan'){findIn('planned',id).done=true}
   if(k==='trip'){const [tid,bid,w]=id.split('~');const b=findIn('travel.trips',tid).bookings.find(x=>x.id===bid);prev={status:b.status};b.status=w==='book'?'booked':w==='dep'?'deposit':'paid'}
   if(k==='unit'){const f=findUnit(id);prev={status:f.u.status};setUnit(f.c,f.u,'done')}
   if(H[key])H[key].prev=prev;else{const x=tasksToday();H[key]={kind:k,id,title:el.closest('.item')?.querySelector('.t')?.firstChild?.textContent?.trim()||'',sub:'',done:true,prev}}
   rerender();tick(880);undoDoneToast(k,id)},

function setUnit(c,u,st){u.status=st;u.doneAt=st==='done'?(u.doneAt||today()):'';if(st!=='todo'&&c.status==='Lined up'){c.status='Studying';if(!c.start)c.start=today()}const U=c.units||[];if(U.length&&U.every(x=>x.status==='done')&&c.status!=='Completed'){c.status='Completed';c.progress=100;chime();toast('Every unit done — course completed. 🎓')}else if(c.status==='Completed'&&U.some(x=>x.status!=='done')){c.status='Studying'}}
/* ============ REMINDERS & NOTIFICATIONS ============ */
const evAt=e=>{const [h,m]=(e.time||'00:00').split(':').map(Number);const d=parse(e.date);d.setHours(h,m,0,0);return d.getTime()};
const leadOf=e=>{const r=e.remind;if(r==='none')return null;if(r!==''&&r!=null)return +r;return num(S.notify.lead)};
const remKey=e=>e.date+'|'+e.time+'|'+e.title;
function upcomingReminders(mins){if(!S.notify.on)return[];const now=Date.now(),t=today();return events(t,addDays(t,Math.max(1,Math.ceil(mins/1440)))).filter(e=>e.time&&leadOf(e)!==null).map(e=>({...e,at:evAt(e),fireAt:evAt(e)-leadOf(e)*60000})).filter(e=>e.at>now&&e.at-now<=mins*60000).sort((a,b)=>a.at-b.at)}
function fireReminder(e,key,body){
  reminderSound();if(S.notify.repeat&&!String(key).startsWith('test')){let n=0;const iv=setInterval(()=>{if(!document.body.contains(box)||++n>4){clearInterval(iv);return}reminderSound()},30000)}
  const when=body||(e.at&&e.at>Date.now()?`Starts at ${e.time} — in ${Math.max(1,Math.round((e.at-Date.now())/60000))} min`:`Now · ${e.time}`);
  try{if('Notification' in window&&Notification.permission==='granted'){const n=new Notification(e.title,{body:when+' · '+(e.mod==='dashboard'?'capture':e.mod),tag:key,requireInteraction:true});n.onclick=()=>{window.focus();n.close()}}}catch(err){}
  const box=document.createElement('div');box.className='rem-pop';box.innerHTML=`<div class="kicker">${icon('bell')} Reminder</div><div class="rem-t">${esc(e.title)}</div><div class="small muted">${esc(when)}</div><div class="row" style="margin-top:10px;gap:6px">${e.link?`<a class="btn sm" href="${esc(e.link)}" target="_blank" rel="noopener">Join</a>`:''}<button class="btn ${e.link?'ghost ':''}sm" data-act="remOpen" data-d="${e.date}">Open</button><button class="btn ghost sm" data-act="remSnooze" data-k="${esc(key)}" data-v="5">Snooze 5 min</button><button class="btn ghost sm" data-act="remDismiss">Dismiss</button></div>`;
  let stack=document.getElementById('remStack');if(!stack){stack=document.createElement('div');stack.id='remStack';document.body.appendChild(stack)}stack.appendChild(box);
  if(document.hidden){let n=0;const o=document.title;const iv=setInterval(()=>{document.title=n++%2?o:'🔔 '+e.title;if(!document.hidden||n>40){clearInterval(iv);document.title=o}},1000)}}
function checkReminders(){if(!S.notify.on)return;const now=Date.now(),t=today();let changed=false;
  events(addDays(t,-1),addDays(t,2)).forEach(e=>{if(!e.time)return;const lead=leadOf(e);if(lead===null)return;const at=evAt(e),fireAt=at-lead*60000,key=remKey(e);
    const snz=S.snooze[key];if(snz){if(now>=snz){delete S.snooze[key];changed=true;fireReminder({...e,at},key);S.notified[key]=now}return}
    if(!S.notified[key]&&now>=fireAt&&now<at+30*60000){S.notified[key]=now;changed=true;fireReminder({...e,at},key)}});
  /* morning digest */
  if(S.notify.digest){const dk='digest|'+t;const [h,m]=(S.notify.digestTime||'08:00').split(':').map(Number);const d=new Date();if(!S.notified[dk]&&(d.getHours()>h||(d.getHours()===h&&d.getMinutes()>=m))&&d.getHours()<h+4){S.notified[dk]=now;changed=true;const ts=tasksToday().length,ev=events(t,t);if(true)fireReminder({title:'Good morning'+(S.settings.owner?', '+S.settings.owner.split(' ')[0]:''),date:t,time:'',mod:'dashboard'},dk,`${ts} task${ts===1?'':'s'} and ${ev.length} calendar item${ev.length===1?'':'s'} today · “${quoteOfDay()[0]}”`)}}
  /* prune */
  Object.keys(S.notified).forEach(k=>{if(now-S.notified[k]>3*864e5){delete S.notified[k];changed=true}});
  if(changed)save()}
setInterval(checkReminders,20000);setTimeout(checkReminders,1500);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkReminders()});
function openReminders(){const up=upcomingReminders(7*1440);const N=S.notify;const perm='Notification' in window?Notification.permission:'unsupported';const t=today();
  modal(`<h2>Reminders</h2><div class="note">Anything with a time — meetings, events, captures, study reminders — pops up before it starts.</div>
  <h3 style="font-family:var(--serif);font-weight:500;font-size:20px;margin:6px 0 8px">Coming up · next 7 days</h3>
  <div class="list">${up.length?up.map(e=>`<div class="item" style="border-left:3px solid ${MODCOLOR[e.mod]}"><div class="grow"><div class="t">${esc(e.title)}</div><div class="s">${e.date===t?'Today':fmtShort(e.date)} · ${e.time} · alert ${leadOf(e)===0?'at start':leadOf(e)>=1440?'1 day before':leadOf(e)>=60?(leadOf(e)/60)+' h before':leadOf(e)+' min before'}</div></div></div>`).join(''):'<div class="empty">Nothing timed in the next week. Give an event or meeting a time to get a reminder.</div>'}</div>

/* ============ FILES ============ */
function readAs(file,how='text'){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;how==='url'?r.readAsDataURL(file):r.readAsText(file)})}
function shrink(dataUrl,max=1400){return new Promise(res=>{const i=new Image();i.onload=()=>{const s=Math.min(1,max/Math.max(i.width,i.height));const c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};i.onerror=()=>res(dataUrl);i.src=dataUrl})}
function csvParse(txt){const rows=[];let r=[],v='',q=false;for(let i=0;i<txt.length;i++){const ch=txt[i];if(q){if(ch==='"'&&txt[i+1]==='"'){v+='"';i++}else if(ch==='"')q=false;else v+=ch}else if(ch==='"')q=true;else if(ch===','){r.push(v);v=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&txt[i+1]==='\n')i++;r.push(v);rows.push(r);r=[];v=''}else v+=ch}if(v||r.length){r.push(v);rows.push(r)}return rows}
async function handleFile(el){const files=[...el.files];if(!files.length)return;const kind=el.dataset.file;
  if(kind==='goodreads'){const rows=csvParse(await readAs(files[0]));const H=rows.shift().map(h=>h.trim());const ix=k=>H.indexOf(k);let n=0;
    rows.forEach(r=>{const title=r[ix('Title')];if(!title)return;const shelf=r[ix('Exclusive Shelf')]||'';S.culture.items.push({id:uid(),list:'books',title,by:r[ix('Author')]||'',rating:num(r[ix('My Rating')]),status:shelf==='read'?'Finished':shelf==='currently-reading'?'Reading':'Want'});n++});rerender();toast(`Imported ${n} books.`)}
  if(kind==='ics'){const evs=parseIcs(await readAs(files[0]));const r=importEvents(evs,'ics');rerender();toast(`Imported ${r.added} new, updated ${r.updated}.`)}
  if(kind==='mail'){let added=0;for(const f of files){let txt=await readAs(f);if(/\.eml$/i.test(f.name)||/^(Received|Return-Path|MIME-Version):/mi.test(txt))txt=emlText(txt);if(/BEGIN:VEVENT/.test(txt)){const evs=parseIcs(txt);if(evs.length){UI.mailDraft={...evs[0],more:evs.length-1};if(evs.length>1)importEvents(evs.slice(1),'email')}}else{UI.mailDraft=parseInvite(txt)}}render();toast('Check the details, then add it.')}
  if(kind==='vbImg'){for(const f of files){const u=await shrink(await readAs(f,'url'));const n=S.goals.board.tiles.length;S.goals.board.tiles.push({id:uid(),type:'img',src:u,x:5+(n%2)*47,y:5+Math.floor(n/2)*22%80,w:43,h:20})}rerender()}
  if(kind==='icon'){const u=await readAs(files[0],'url');S.settings.iconData=await squareIcon(u,256);save();closeModal();render();openSettings();toast('Icon updated.');el.value='';return}
  if(kind==='font'){const f=files[0];if(f.size>3e6){toast('That font file is over 3 MB — try a .woff2 version.');el.value='';return}S.settings.fontOff=false;S.settings.fontData=await readAs(f,'url');S.settings.fontName=f.name.replace(/\.[^.]+$/,'');save();applyFont();closeModal();render();toast('Font applied.');el.value='';return}
  if(kind==='tripdoc'){const tr=findIn('travel.trips',el.dataset.trip);tr.docs=tr.docs||[];let n=0;for(const f of files){if(f.size>25e6){toast(f.name+' is over 25 MB — add it as a link instead.');continue}const id=uid();let stored=false;try{await FILES.put(id,f);stored=true}catch(e){}const doc={id,name:f.name,mime:f.type,size:f.size,added:today()};if(!stored){if(f.size>1.5e6){toast('This browser can’t store large files — add it as a link.');continue}doc.data=await readAs(f,'url')}tr.docs.push(doc);n++}UI.tripOpen=UI.tripOpen||{};UI.tripOpen[tr.id+'docs']=true;rerender();if(n)toast(`${n} document${n===1?'':'s'} added to ${tr.name}.`)}
  if(kind==='import'){try{const J=JSON.parse(await readAs(files[0]));const F=J._files||{};delete J._files;S=merge(blank(),J);for(const [k,v] of Object.entries(F)){try{await FILES.put(k,await (await fetch(v)).blob())}catch(e){}}S.settings.setup=true;closeModal();rerender();toast('Imported.')}catch(e){toast('That file is not a planner backup.')}}
  el.value=''}

function vbBind(){const vb=$('#vb');if(!vb)return;let st=null;
  vb.onpointerdown=e=>{if(e.target.dataset.act)return;const tile=e.target.closest('[data-tile]');if(!tile)return;const rs=e.target.dataset.rs;const t=S.goals.board.tiles.find(x=>x.id===tile.dataset.tile);const r=vb.getBoundingClientRect();st={t,tile,rs,sx:e.clientX,sy:e.clientY,o:{...t},W:r.width,H:r.height};tile.setPointerCapture(e.pointerId);e.preventDefault()};
  vb.onpointermove=e=>{if(!st)return;const dx=(e.clientX-st.sx)/st.W*100,dy=(e.clientY-st.sy)/st.H*100;const t=st.t;
    if(st.rs){t.w=Math.max(8,Math.min(100-t.x,st.o.w+dx));t.h=Math.max(4,Math.min(100-t.y,st.o.h+dy))}else{t.x=Math.max(0,Math.min(100-t.w,st.o.x+dx));t.y=Math.max(0,Math.min(100-t.h,st.o.y+dy))}
    Object.assign(st.tile.style,{left:t.x+'%',top:t.y+'%',width:t.w+'%',height:t.h+'%'})};
  vb.onpointerup=()=>{if(st){st=null;save()}};
  vb.ondblclick=e=>{const tile=e.target.closest('[data-tile]');if(!tile)return;const t=S.goals.board.tiles.find(x=>x.id===tile.dataset.tile);if(t.type!=='text')return;modal(`<h2>Edit words</h2><form class="form" data-form="vbEdit" data-id="${t.id}">${field({k:'text',cls:'full'},t.text)}<button class="btn">Save</button></form>`)}}
FORM.vbEdit=(d,f)=>{S.goals.board.tiles.find(x=>x.id===f.dataset.id).text=d.text;closeModal();rerender()};

function openSearch(){modal(`<h2>Search everything</h2><input type="search" id="sq" placeholder="Bills, people, books, notes…" autocomplete="off"><div id="sr" style="margin-top:10px"></div>`);

    const walk=(o,root,path)=>{if(out.length>40)return;if(Array.isArray(o))o.forEach(x=>walk(x,root,path));else if(o&&typeof o==='object'){const txt=Object.entries(o).filter(([k,v])=>typeof v==='string'&&!/^(id|src|img|audio|data)$/.test(k)&&!v.startsWith('data:')).map(([,v])=>v).join(' · ');if(o.id&&txt.toLowerCase().includes(q))out.push({mod:o.module||root,txt});Object.entries(o).forEach(([k,v])=>{if(v&&typeof v==='object')walk(v,root,path+'.'+k)})}};

let REC=null;
function voice(el){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;const target=el.closest('.fld,.card,form')?.querySelector('input[type=text],textarea');
  if(!SR)return toast('Voice typing needs Chrome, Edge or Safari.');if(REC){REC.stop();return}
  REC=new SR();REC.lang=navigator.language||'en-US';REC.interimResults=false;el.classList.add('live');
